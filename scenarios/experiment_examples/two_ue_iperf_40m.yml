---
name: two_ue_iperf_40m
title: Two-UE 40 Mb/s TCP iperf artifact example
timezone: Europe/Paris

iperf:
  target_server_host: sopnode-f2
  ues: ["qhat01", "qhat03"]
  base_port: 5201
  duration: 60
  bitrate: "40M"

sections:
  - name: uplink_40m_qhat01_qhat03
    title: qhat01/qhat03 uplink TCP at 40 Mb/s
    runner:
      type: tasks
      file: tasks/experiment_iperf_tcp_section.yml
      vars:
        traffic:
          - ue: qhat01
            direction: ul
            port_offset: 0
          - ue: qhat03
            direction: ul
            port_offset: 1

  - name: downlink_40m_qhat01_qhat03
    title: qhat01/qhat03 downlink TCP at 40 Mb/s
    runner:
      type: tasks
      file: tasks/experiment_iperf_tcp_section.yml
      vars:
        traffic:
          - ue: qhat01
            direction: dl
            port_offset: 0
          - ue: qhat03
            direction: dl
            port_offset: 1
