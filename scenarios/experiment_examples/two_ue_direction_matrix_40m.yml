          iperf3 -p '$BASE_PORT' -B '$ue_ip' -c '$SERVER_IP' -t '$DURATION' -b '$BITRATE' \
            --json --get-server-output \
            > '$LOG_ROOT/iperf_qhat01_ul.json' \
