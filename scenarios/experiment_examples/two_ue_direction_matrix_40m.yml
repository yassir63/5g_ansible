        "
        scp -o ConnectTimeout=5 -o BatchMode=yes -o StrictHostKeyChecking=no root@qhat01:"$LOG_ROOT/iperf_qhat01_ul.json" "$LOG_ROOT/" >/dev/null 2>&1 || true
        scp -o ConnectTimeout=5 -o BatchMode=yes -o StrictHostKeyChecking=no root@qhat01:"$LOG_ROOT/iperf_qhat01_ul.stderr" "$LOG_ROOT/" >/dev/null 2>&1 || true
        tar -C "/tmp/${RUN_ID}" -czf "/tmp/${RUN_ID}_qhat01_ul_only.tgz" "direction_matrix/qhat01_ul_only"

