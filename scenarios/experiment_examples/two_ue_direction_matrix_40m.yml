---
name: two_ue_direction_matrix_40m
title: Two-UE direction matrix at 40 Mb/s
timezone: Europe/Paris

iperf:
  target_server_host: sopnode-f2
  ues: ["qhat01", "qhat03"]
  base_port: 5201
  duration: 60
  bitrate: "40M"

sections:
  - name: qhat01_ul_qhat03_dl
    title: qhat01 uplink while qhat03 downlink
    artifacts:
      pcap:
        enabled: true
        capture_seconds: 5
    runner:
      type: tasks
      file: tasks/experiment_iperf_tcp_section.yml
      vars:
        traffic:
          - ue: qhat01
            direction: ul
            port_offset: 0
          - ue: qhat03
            direction: dl
            port_offset: 1

  - name: qhat01_dl_qhat03_ul
    title: qhat01 downlink while qhat03 uplink
    collect:
      prometheus:
        enabled: false
    runner:
      type: tasks
      file: tasks/experiment_iperf_tcp_section.yml
      vars:
        traffic:
          - ue: qhat01
            direction: dl
            port_offset: 0
          - ue: qhat03
            direction: ul
            port_offset: 1

  - name: qhat01_ul_only
    title: qhat01 uplink only while qhat03 idle
    runner:
      type: tasks
      file: tasks/experiment_iperf_tcp_section.yml
      vars:
        traffic:
          - ue: qhat01
            direction: ul
            port_offset: 0

  - name: qhat01_dl_only
    title: qhat01 downlink only while qhat03 idle
    runner:
      type: tasks
      file: tasks/experiment_iperf_tcp_section.yml
      vars:
        traffic:
          - ue: qhat01
            direction: dl
            port_offset: 0

  - name: qhat03_ul_only
    title: qhat03 uplink only while qhat01 idle
    runner:
      type: tasks
      file: tasks/experiment_iperf_tcp_section.yml
      vars:
        traffic:
          - ue: qhat03
            direction: ul
            port_offset: 1

  - name: qhat03_dl_only
    title: qhat03 downlink only while qhat01 idle
    runner:
      type: tasks
      file: tasks/experiment_iperf_tcp_section.yml
      vars:
        traffic:
          - ue: qhat03
            direction: dl
            port_offset: 1
