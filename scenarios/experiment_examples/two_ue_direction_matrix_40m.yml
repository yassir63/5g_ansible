---
name: two_ue_direction_matrix_40m
title: Two-UE direction matrix at 40 Mb/s
timezone: Europe/Paris

iperf:
  control_host: faraday.inria.fr
  target_server_host: sopnode-f2
  ues: ["qhat01", "qhat03"]
  base_port: 5201
  duration: 60
  bitrate: "40M"

sections:
  - name: precheck_ue_connectivity
    title: Check qhat01/qhat03 wwan0 IPs and server route
    runner:
      type: command
      host: "{{ experiment_scenario.iperf.control_host }}"
      command: |
        set -euo pipefail
        {% set server_host = target_server_host | default(experiment_scenario.iperf.target_server_host) %}
        SERVER_IP="{{ hostvars[server_host].ip | default(hostvars[server_host].ansible_host | default(server_host)) }}"
        UES="{{ experiment_scenario.iperf.ues | join(' ') }}"

        missing=""
        for ue in $UES; do
          echo "Checking ${ue} before traffic..."
          ue_ip=$(ssh -o ConnectTimeout=5 -o BatchMode=yes -o StrictHostKeyChecking=no root@"$ue" \
            "ip -4 addr show wwan0 | grep -oP '(?<=inet\s)\d+(\.\d+){3}' | head -n 1" || true)

          if [ -z "$ue_ip" ]; then
            echo "ERROR: ${ue} has no IPv4 address on wwan0." >&2
            missing="${missing} ${ue}:no_wwan0_ip"
            continue
          fi

          if ! ssh -o ConnectTimeout=5 -o BatchMode=yes -o StrictHostKeyChecking=no root@"$ue" \
            "ip route get '$SERVER_IP' >/dev/null 2>&1"; then
            echo "ERROR: ${ue} has wwan0=${ue_ip}, but no route to ${SERVER_IP}." >&2
            missing="${missing} ${ue}:no_route_to_server"
            continue
          fi

          route=$(ssh -o ConnectTimeout=5 -o BatchMode=yes -o StrictHostKeyChecking=no root@"$ue" \
            "ip route get '$SERVER_IP' | head -n 1")
          echo "OK: ${ue} wwan0=${ue_ip}; route=${route}"
        done

        if [ -n "$missing" ]; then
          echo "UE connectivity precheck failed:${missing}" >&2
          echo "Connect the UEs and ensure they can route to ${SERVER_IP} before running this generic artifact example." >&2
          exit 1
        fi

  - name: prepare_iperf_server
    title: Start iperf servers for the two UE ports
    runner:
      type: command
      host: "{{ target_server_host | default(experiment_scenario.iperf.target_server_host) }}"
      command: |
        set -euo pipefail
        {% set server_host = target_server_host | default(experiment_scenario.iperf.target_server_host) %}
        SERVER_IP="{{ hostvars[server_host].ip | default(hostvars[server_host].ansible_host | default(server_host)) }}"
        BASE_PORT="{{ iperf_base_port | default(experiment_scenario.iperf.base_port) }}"
        UE_COUNT="{{ experiment_scenario.iperf.ues | length }}"
        LOG_DIR="/root/IPERF/{{ experiment_run_id }}/two_ue_direction_matrix_40m"

        if ! command -v iperf3 >/dev/null 2>&1; then
          if command -v apt-get >/dev/null 2>&1; then
            DEBIAN_FRONTEND=noninteractive apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iperf3
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y -q iperf3
          elif command -v yum >/dev/null 2>&1; then
            yum install -y -q iperf3
          fi
        fi

        command -v iperf3 >/dev/null 2>&1
        mkdir -p "$LOG_DIR"

        idx=0
        while [ "$idx" -lt "$UE_COUNT" ]; do
          port=$((BASE_PORT + idx))
          pkill -f "iperf3 .* -s .* -p ${port}" >/dev/null 2>&1 || true
          iperf3 -s -B "$SERVER_IP" -p "$port" -D --logfile "$LOG_DIR/server_${port}.log"
          idx=$((idx + 1))
        done

        ss -tulpn | grep iperf3 || netstat -tulpn | grep iperf3 || true

  - name: qhat01_ul_qhat03_dl
    title: qhat01 uplink while qhat03 downlink
    artifacts:
      pcap:
        enabled: true
        capture_seconds: 5
    runner:
      type: command
      host: "{{ experiment_scenario.iperf.control_host }}"
      fetch:
        - src: "/tmp/{{ experiment_run_id }}_qhat01_ul_qhat03_dl.tgz"
          dest: "iperf_qhat01_ul_qhat03_dl.tgz"
      command: |
        set -euo pipefail
        {% set server_host = target_server_host | default(experiment_scenario.iperf.target_server_host) %}
        SERVER_IP="{{ hostvars[server_host].ip | default(hostvars[server_host].ansible_host | default(server_host)) }}"
        RUN_ID="{{ experiment_run_id }}"
        BASE_PORT="{{ iperf_base_port | default(experiment_scenario.iperf.base_port) }}"
        DURATION="{{ iperf_duration | default(experiment_scenario.iperf.duration) }}"
        BITRATE="{{ iperf_bitrate | default(experiment_scenario.iperf.bitrate) }}"
        LOG_ROOT="/tmp/${RUN_ID}/direction_matrix/qhat01_ul_qhat03_dl"
        rm -rf "$LOG_ROOT"
        mkdir -p "$LOG_ROOT"

        run_one() {
          ue="$1"
          direction="$2"
          port="$3"
          ue_ip=$(ssh -o ConnectTimeout=5 -o BatchMode=yes -o StrictHostKeyChecking=no root@"$ue" \
            "ip -4 addr show wwan0 | grep -oP '(?<=inet\s)\d+(\.\d+){3}' | head -n 1")
          extra=""
          if [ "$direction" = "dl" ]; then
            extra="-R"
          fi
          echo "Starting ${direction} ${ue}: ue_ip=${ue_ip} server=${SERVER_IP} port=${port} bitrate=${BITRATE}"
          ssh -o ConnectTimeout=5 -o BatchMode=yes -o StrictHostKeyChecking=no root@"$ue" "
            set -e
            mkdir -p '$LOG_ROOT'
            iperf3 -p '$port' -B '$ue_ip' -c '$SERVER_IP' -t '$DURATION' -b '$BITRATE' $extra \
              --json --get-server-output \
              > '$LOG_ROOT/iperf_${ue}_${direction}.json' \
              2> '$LOG_ROOT/iperf_${ue}_${direction}.stderr'
          " &
          pids="${pids:-} $!"
        }

        pids=""
        run_one qhat01 ul "$BASE_PORT"
        run_one qhat03 dl "$((BASE_PORT + 1))"
        rc=0
        for pid in $pids; do
          wait "$pid" || rc=1
        done

        for ue in qhat01 qhat03; do
          for direction in ul dl; do
            scp -o ConnectTimeout=5 -o BatchMode=yes -o StrictHostKeyChecking=no \
              root@"$ue":"$LOG_ROOT/iperf_${ue}_${direction}.json" "$LOG_ROOT/" >/dev/null 2>&1 || true
            scp -o ConnectTimeout=5 -o BatchMode=yes -o StrictHostKeyChecking=no \
              root@"$ue":"$LOG_ROOT/iperf_${ue}_${direction}.stderr" "$LOG_ROOT/" >/dev/null 2>&1 || true
          done
        done
        tar -C "/tmp/${RUN_ID}" -czf "/tmp/${RUN_ID}_qhat01_ul_qhat03_dl.tgz" "direction_matrix/qhat01_ul_qhat03_dl"
        exit "$rc"

