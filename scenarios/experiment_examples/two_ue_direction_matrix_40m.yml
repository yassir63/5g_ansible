        ssh -o ConnectTimeout=5 -o BatchMode=yes -o StrictHostKeyChecking=no root@qhat01 "
          set -e
          mkdir -p '$LOG_ROOT'
          iperf3 -p '$BASE_PORT' -B '$ue_ip' -c '$SERVER_IP' -t '$DURATION' -b '$BITRATE' -R \
            --json --get-server-output \
            > '$LOG_ROOT/iperf_qhat01_dl.json' \
            2> '$LOG_ROOT/iperf_qhat01_dl.stderr'
        "
        scp -o ConnectTimeout=5 -o BatchMode=yes -o StrictHostKeyChecking=no root@qhat01:"$LOG_ROOT/iperf_qhat01_dl.json" "$LOG_ROOT/" >/dev/null 2>&1 || true
        scp -o ConnectTimeout=5 -o BatchMode=yes -o StrictHostKeyChecking=no root@qhat01:"$LOG_ROOT/iperf_qhat01_dl.stderr" "$LOG_ROOT/" >/dev/null 2>&1 || true
        tar -C "/tmp/${RUN_ID}" -czf "/tmp/${RUN_ID}_qhat01_dl_only.tgz" "direction_matrix/qhat01_dl_only"

