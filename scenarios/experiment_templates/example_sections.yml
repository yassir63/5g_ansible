---
name: basic_artifact_sections
title: Basic artifact-collection experiment

sections:
  - name: baseline
    title: Baseline wait with artifact window
    runner:
      type: pause
      seconds: 30

  - name: workload
    title: Replace this with a command, task file, or playbook
    runner:
      type: command
      command: "echo example && sleep 30"

  - name: recovery
    title: Recovery wait
    runner:
      type: pause
      seconds: 30

  - name: connect_and_baseline
    title: Run an existing setup or baseline playbook
    pcap:
      enabled: false
    runner:
      type: playbook
      file: playbooks/my_playbook.yml
      extra_vars:
        duration: 60
