---
- name: START_UE_SETUP
  ansible.builtin.meta: noop

- name: Load active 5G profile variables
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../group_vars/all/5g_profile_{{ fiveg_profile | default('default') }}.yaml"

- name: Assert 5G profile is loaded
  ansible.builtin.assert:
    that:
      - slices is defined
      - ues is defined

- name: Build UE lists
  set_fact:
    all_ues: "{{ (groups['qhats'] | default([])) + (groups['qfits'] | default([])) }}"

- name: Power OFF QHAT UEs
  shell: rhubarbe pdu off "{{ item }}"
  delegate_to: faraday.inria.fr
  async: 1800
  poll: 0
  failed_when: false
  changed_when: false
  loop: "{{ groups['qhats'] | default([]) }}"
  register: qhat_off_jobs

- name: Wait QHAT OFF completion
  async_status:
    jid: "{{ item.ansible_job_id }}"
  register: qhat_off_status
  until: qhat_off_status.finished
  retries: 12
  delay: 5
  loop: "{{ qhat_off_jobs.results }}"
  failed_when: false

- name: Power OFF QFIT UEs
  shell: qfit off {{ groups['qfits'] | join(' ') }}
  delegate_to: faraday.inria.fr
  when: groups['qfits'] is defined and groups['qfits'] | length > 0
  failed_when: false
  changed_when: false

- pause:
    seconds: 20

- name: Power ON QHAT UEs
  shell: rhubarbe pdu on "{{ item }}"
  delegate_to: faraday.inria.fr
  async: 1800
  poll: 0
  loop: "{{ groups['qhats'] | default([]) }}"
  register: qhat_on_jobs

- name: Wait QHAT ON completion
  async_status:
    jid: "{{ item.ansible_job_id }}"
  register: qhat_on_status
  until: qhat_on_status.finished
  retries: 12
  delay: 5
  loop: "{{ qhat_on_jobs.results }}"

- name: Power ON QFIT UEs
  shell: qfit on {{ groups['qfits'] | join(' ') }}
  delegate_to: faraday.inria.fr
  when: groups['qfits'] is defined and groups['qfits'] | length > 0

- name: Ping UEs
  shell: "ping -c1 -W1 {{ item }}"
  delegate_to: faraday.inria.fr
  register: ping_results
  ignore_errors: true
  changed_when: false
  retries: 12            # ~2 min max par UE
  delay: 10
  until: ping_results.rc == 0
  loop: "{{ all_ues }}"

- name: Build reachable UEs
  set_fact:
    reachable_ues: >-
      {{
        ping_results.results
        | selectattr('rc', 'defined')
        | selectattr('rc', 'equalto', 0)
        | map(attribute='item')
        | list
      }}

- name: SSH check (real login, parallel over UEs)
  # At most 5 authenticated login attempts per UE, spaced by 10s. Each attempt is
  # capped at 12s so a stalled sshd cannot block the loop.
  # Worst case per UE: 5 x 12s + 4 x 10s = 100s < async 110s.
  shell: >
    for i in 1 2 3 4 5; do
    timeout 12 ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
    -o BatchMode=yes -o ConnectTimeout=5 -o ConnectionAttempts=1 root@{{ item }} true && exit 0;
    [ $i -lt 5 ] && sleep 10; done; exit 1
  delegate_to: faraday.inria.fr
  async: 110
  poll: 0
  changed_when: false
  loop: "{{ reachable_ues }}"
  register: ssh_jobs

- name: Wait SSH check completion (bounded by async 110s)
  # Jobs run in parallel and are killed by async after 110s at most,
  # so the whole wait stays under 2 minutes whatever the number of UEs.
  async_status:
    jid: "{{ item.ansible_job_id }}"
  delegate_to: faraday.inria.fr
  register: ssh_results
  until: ssh_results.finished
  retries: 24
  delay: 5
  failed_when: false   # a dead UE must be excluded, not abort the play
  changed_when: false
  loop: "{{ ssh_jobs.results }}"

- name: Keep only SSH-reachable UEs
  set_fact:
    reachable_ues: "{{ ssh_results.results | selectattr('rc', 'defined') | selectattr('rc', 'equalto', 0) | map(attribute='item.item') | list }}"

- name: Compute failed UEs
  set_fact:
    failed_ues: "{{ all_ues | difference(reachable_ues) }}"

- name: Report failed UEs
  debug:
    msg: "UEs not reachable after boot: {{ failed_ues }}"
  when: failed_ues | length > 0

- name: Show qhat-init command per UE
  vars:
    # Slice parameters come from the active 5G profile (ues[<host>].slice -> slices[])
    ue_slice_info: "{{ slices | selectattr('name', 'equalto', ues[item].slice) | first }}"
    # Only pass --mode when explicitly set in inventory; otherwise qhat-init
    # picks it per model (RG255C -> qmi, others -> mbim)
    ue_mode_opt: "{{ ('--mode=' ~ hostvars[item].mode) if hostvars[item].mode is defined else '' }}"
    # sd "EMPTY" means no SD: omit --nssai so qhat-init takes its
    # "no specific NSSAI" path ("1.EMPTY" is not a valid S-NSSAI)
    ue_nssai_opt: >-
      {{ ('--nssai=' ~ ue_slice_info.sst ~ '.' ~ ue_slice_info.sd)
         if ue_slice_info.sd != 'EMPTY' else '' }}
    # No --nssai: as every subscriber has a single default slice, CID 1 without
    # S-NSSAI gets the right slice. Creating the extra CID 2 with S-NSSAI makes
    # some modems (seen on qhat03) auto-activate it and reject start.sh's connect.
    qhat_command: >-
      qhat-init {{ ue_mode_opt }}
      --dnn="{{ ue_slice_info.dnn }}"
      {{ ue_nssai_opt }}
  debug:
    msg: "UE {{ item }} command: {{ qhat_command }}"
  loop: "{{ reachable_ues }}"

- name: Configure rmem buffers
  shell: |
    ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@{{ item }} '
      sysctl -w net.core.rmem_max=62500000;
      sysctl -w net.core.rmem_default=62500000;
    '
  delegate_to: faraday.inria.fr
  loop: "{{ reachable_ues }}"
  when: rru in ['benetel1', 'benetel2']

- name: Init UEs (qhat-init with profile options, parallel)
  shell: >
    ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@{{ item }}
    '{{ qhat_command }}'
  vars:
    # Slice parameters come from the active 5G profile (ues[<host>].slice -> slices[])
    ue_slice_info: "{{ slices | selectattr('name', 'equalto', ues[item].slice) | first }}"
    # Only pass --mode when explicitly set in inventory; otherwise qhat-init
    # picks it per model (RG255C -> qmi, others -> mbim)
    ue_mode_opt: "{{ ('--mode=' ~ hostvars[item].mode) if hostvars[item].mode is defined else '' }}"
    # sd "EMPTY" means no SD: omit --nssai so qhat-init takes its
    # "no specific NSSAI" path ("1.EMPTY" is not a valid S-NSSAI)
    ue_nssai_opt: >-
      {{ ('--nssai=' ~ ue_slice_info.sst ~ '.' ~ ue_slice_info.sd)
         if ue_slice_info.sd != 'EMPTY' else '' }}
    # No --nssai: as every subscriber has a single default slice, CID 1 without
    # S-NSSAI gets the right slice. Creating the extra CID 2 with S-NSSAI makes
    # some modems (seen on qhat03) auto-activate it and reject start.sh's connect.
    qhat_command: >-
      qhat-init {{ ue_mode_opt }}
      --dnn="{{ ue_slice_info.dnn }}"
      {{ ue_nssai_opt }}
  delegate_to: faraday.inria.fr
  async: 1800
  poll: 0
  loop: "{{ reachable_ues }}"
  register: set_ue_jobs

- name: Wait init completion
  async_status:
    jid: "{{ item.ansible_job_id }}"
  loop: "{{ set_ue_jobs.results }}"
  register: job_result
  until: job_result.finished
  retries: 20
  delay: 10

# stop.sh picks mbim/qmi from /run/ue-mode (written by qhat-init);
# the QMI path detaches via ci_ctl_qtel.py. Best-effort.
- name: Stop UEs after init (parallel, best-effort)
  shell: >
    ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@{{ item }}
    'stop.sh'
  delegate_to: faraday.inria.fr
  async: 300
  poll: 0
  loop: "{{ reachable_ues }}"
  register: stop_ue_jobs

- name: Wait stop completion (best-effort)
  async_status:
    jid: "{{ item.ansible_job_id }}"
  loop: "{{ stop_ue_jobs.results }}"
  register: stop_result
  until: stop_result.finished
  retries: 20
  delay: 5
  failed_when: false
  ignore_errors: true

- name: Run qhat-check
  shell: ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@{{ item }} 'qhat-check'
  delegate_to: faraday.inria.fr
  loop: "{{ reachable_ues }}"
  register: check_results
  changed_when: false
  ignore_errors: true

- name: Display qhat-check
  debug:
    msg: "{{ item.stdout }}"
  loop: "{{ check_results.results }}"
  loop_control:
    label: "{{ item.item }}"

  