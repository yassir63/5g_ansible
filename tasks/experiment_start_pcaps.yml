---
- name: Ensure local experiment pcap directory exists
  ansible.builtin.file:
    path: "{{ experiment_results_dir }}/pcaps/{{ experiment_window_label }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  when: experiment_pcap_enabled_effective | bool

- name: Start experiment host pcaps
  ansible.builtin.shell: |
    set -u
    RUN_DIR="/tmp/{{ experiment_run_id }}/pcaps/{{ experiment_window_label }}"
    NAME="{{ item.name }}"
    IFACE="{{ item.interface | default(experiment_pcap_interface) }}"
    FILTER="{{ item.filter | default(experiment_pcap_filter) }}"
    SNAPLEN="{{ item.snaplen | default(experiment_pcap_snaplen) }}"
    CAPTURE_SECONDS="{{ item.capture_seconds | default(experiment_pcap_capture_seconds_effective) }}"
    AUTO_INSTALL="{{ (item.auto_install_tcpdump | default(experiment_pcap_auto_install_tcpdump)) | bool | ternary('1', '0') }}"
    LOG="$RUN_DIR/${NAME}.tcpdump.log"
    PID_FILE="$RUN_DIR/${NAME}.pid"
    PCAP="$RUN_DIR/${NAME}.pcap"

    mkdir -p "$RUN_DIR"
    if [ -f "$PID_FILE" ]; then
      kill -INT "$(cat "$PID_FILE")" >/dev/null 2>&1 || true
      sleep 1
    fi

    install_tcpdump() {
      if [ "$AUTO_INSTALL" != "1" ]; then
        return 1
      fi
      if command -v apt-get >/dev/null 2>&1; then
        DEBIAN_FRONTEND=noninteractive apt-get update >> "$LOG" 2>&1 || true
        DEBIAN_FRONTEND=noninteractive apt-get install -y tcpdump >> "$LOG" 2>&1 || true
      elif command -v dnf >/dev/null 2>&1; then
        dnf install -y tcpdump >> "$LOG" 2>&1 || true
      elif command -v yum >/dev/null 2>&1; then
        yum install -y tcpdump >> "$LOG" 2>&1 || true
      elif command -v microdnf >/dev/null 2>&1; then
        microdnf install -y tcpdump >> "$LOG" 2>&1 || true
      elif command -v apk >/dev/null 2>&1; then
        apk add --no-cache tcpdump >> "$LOG" 2>&1 || true
      else
        echo "status=tcpdump_not_found package_manager=none" >> "$LOG"
      fi
    }

    {
      echo "target_type=host"
      echo "target_name=${NAME}"
      echo "host=$(hostname -f 2>/dev/null || hostname)"
      echo "interface=${IFACE}"
      echo "filter=${FILTER}"
      echo "capture_seconds=${CAPTURE_SECONDS}"
      echo "started_at=$(date -Is)"
    } > "$LOG"

    if ! command -v tcpdump >/dev/null 2>&1; then
      echo "tcpdump missing before capture; attempting install=${AUTO_INSTALL}" >> "$LOG"
      install_tcpdump
    fi

    if ! command -v tcpdump >/dev/null 2>&1; then
      echo "status=tcpdump_not_found" >> "$LOG"
      exit 42
    fi

    (
      if [ "$CAPTURE_SECONDS" -gt 0 ] 2>/dev/null; then
        if [ -n "$FILTER" ]; then
          timeout "$CAPTURE_SECONDS" tcpdump -i "$IFACE" -s "$SNAPLEN" -U -w "$PCAP" "$FILTER"
        else
          timeout "$CAPTURE_SECONDS" tcpdump -i "$IFACE" -s "$SNAPLEN" -U -w "$PCAP"
        fi
      else
        if [ -n "$FILTER" ]; then
          tcpdump -i "$IFACE" -s "$SNAPLEN" -U -w "$PCAP" "$FILTER"
        else
          tcpdump -i "$IFACE" -s "$SNAPLEN" -U -w "$PCAP"
        fi
      fi
      rc=$?
      echo "finished_at=$(date -Is) rc=${rc}" >> "$LOG"
      exit "$rc"
    ) >> "$LOG" 2>&1 &
    echo "$!" > "$PID_FILE"
    echo "status=started pid=$(cat "$PID_FILE")" >> "$LOG"
  args:
    executable: /bin/bash
  delegate_to: "{{ item.host }}"
  become: true
  loop: "{{ experiment_pcap_targets_effective | selectattr('type', 'defined') | selectattr('type', 'equalto', 'host') | list + experiment_pcap_targets_effective | rejectattr('type', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"
  register: experiment_host_pcap_start
  when: experiment_pcap_enabled_effective | bool
  changed_when: true
  failed_when: false

- name: Start experiment pod pcaps
  ansible.builtin.shell: |
    set -u
    NS="{{ item.namespace }}"
    POD_REGEX="{{ item.pod_regex | default(item.name_regex | default('.*')) }}"
    CONTAINER_REGEX="{{ item.container_regex | default('.*') }}"
    TARGET_NAME="{{ item.name }}"
    IFACE="{{ item.interface | default(experiment_pcap_pod_interface | default(experiment_pcap_interface)) }}"
    FILTER="{{ item.filter | default(experiment_pcap_filter) }}"
    SNAPLEN="{{ item.snaplen | default(experiment_pcap_snaplen) }}"
    CAPTURE_SECONDS="{{ item.capture_seconds | default(experiment_pcap_capture_seconds_effective) }}"
    AUTO_INSTALL="{{ (item.auto_install_tcpdump | default(experiment_pcap_auto_install_tcpdump)) | bool | ternary('1', '0') }}"
    STAGE="/tmp/{{ experiment_run_id }}/pcaps/{{ experiment_window_label }}"
    mkdir -p "$STAGE"

    if ! command -v kubectl >/dev/null 2>&1; then
      echo "target_type=pod target_name=${TARGET_NAME} status=kubectl_not_found" > "$STAGE/${TARGET_NAME}.pod-discovery.log"
      exit 43
    fi

    pods="$(kubectl -n "$NS" get pods -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null | grep -E "$POD_REGEX" || true)"
    if [ -z "$pods" ]; then
      echo "target_type=pod target_name=${TARGET_NAME} namespace=${NS} pod_regex=${POD_REGEX} status=pod_not_found" > "$STAGE/${TARGET_NAME}.pod-discovery.log"
      exit 44
    fi

    rc=0
    for pod in $pods; do
      containers="$(kubectl -n "$NS" get pod "$pod" -o jsonpath='{range .spec.containers[*]}{.name}{"\n"}{end}' 2>/dev/null || true)"
      container="$(printf '%s\n' "$containers" | grep -E "$CONTAINER_REGEX" | head -n 1 || true)"
      if [ -z "$container" ]; then
        container="$(printf '%s\n' "$containers" | head -n 1)"
      fi
      safe_pod="$(printf '%s' "$pod" | tr -c 'A-Za-z0-9_.=-' '_')"
      remote_dir="/tmp/{{ experiment_run_id }}/pcaps/{{ experiment_window_label }}"
      remote_name="${TARGET_NAME}_${safe_pod}"
      kubectl -n "$NS" exec -c "$container" "$pod" -- sh -c '
        set -u
        RUN_DIR="$1"
        NAME="$2"
        IFACE="$3"
        FILTER="$4"
        SNAPLEN="$5"
        CAPTURE_SECONDS="$6"
        AUTO_INSTALL="$7"
        LOG="$RUN_DIR/${NAME}.tcpdump.log"
        PID_FILE="$RUN_DIR/${NAME}.pid"
        PCAP="$RUN_DIR/${NAME}.pcap"
        mkdir -p "$RUN_DIR"
        if [ -f "$PID_FILE" ]; then
          kill -INT "$(cat "$PID_FILE")" >/dev/null 2>&1 || true
          sleep 1
        fi
        {
          echo "target_type=pod"
          echo "target_name=${NAME}"
          echo "pod=$(hostname)"
          echo "interface=${IFACE}"
          echo "filter=${FILTER}"
          echo "capture_seconds=${CAPTURE_SECONDS}"
          echo "started_at=$(date -Is)"
        } > "$LOG"

        install_tcpdump() {
          if [ "$AUTO_INSTALL" != "1" ]; then
            return 1
          fi
          if command -v apt-get >/dev/null 2>&1; then
            DEBIAN_FRONTEND=noninteractive apt-get update >> "$LOG" 2>&1 || true
            DEBIAN_FRONTEND=noninteractive apt-get install -y tcpdump >> "$LOG" 2>&1 || true
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y tcpdump >> "$LOG" 2>&1 || true
          elif command -v yum >/dev/null 2>&1; then
            yum install -y tcpdump >> "$LOG" 2>&1 || true
          elif command -v microdnf >/dev/null 2>&1; then
            microdnf install -y tcpdump >> "$LOG" 2>&1 || true
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache tcpdump >> "$LOG" 2>&1 || true
          else
            echo "status=tcpdump_not_found package_manager=none" >> "$LOG"
          fi
        }

        if ! command -v tcpdump >/dev/null 2>&1; then
          echo "tcpdump missing before capture; attempting install=${AUTO_INSTALL}" >> "$LOG"
          install_tcpdump
        fi
        if ! command -v tcpdump >/dev/null 2>&1; then
          echo "status=tcpdump_not_found" >> "$LOG"
          exit 42
        fi
        (
          if [ "$CAPTURE_SECONDS" -gt 0 ] 2>/dev/null; then
            if [ -n "$FILTER" ]; then
              timeout "$CAPTURE_SECONDS" tcpdump -i "$IFACE" -s "$SNAPLEN" -U -w "$PCAP" "$FILTER"
            else
              timeout "$CAPTURE_SECONDS" tcpdump -i "$IFACE" -s "$SNAPLEN" -U -w "$PCAP"
            fi
          else
            if [ -n "$FILTER" ]; then
              tcpdump -i "$IFACE" -s "$SNAPLEN" -U -w "$PCAP" "$FILTER"
            else
              tcpdump -i "$IFACE" -s "$SNAPLEN" -U -w "$PCAP"
            fi
          fi
          rc=$?
          echo "finished_at=$(date -Is) rc=${rc}" >> "$LOG"
          exit "$rc"
        ) >> "$LOG" 2>&1 &
        echo "$!" > "$PID_FILE"
        echo "status=started pid=$(cat "$PID_FILE")" >> "$LOG"
      ' sh "$remote_dir" "$remote_name" "$IFACE" "$FILTER" "$SNAPLEN" "$CAPTURE_SECONDS" "$AUTO_INSTALL" || rc=$?
    done
    exit "$rc"
  args:
    executable: /bin/bash
  delegate_to: "{{ experiment_pcap_k8s_control_host }}"
  become: true
  environment:
    KUBECONFIG: "{{ experiment_kubeconfig }}"
  loop: "{{ experiment_pcap_targets_effective | selectattr('type', 'defined') | selectattr('type', 'equalto', 'pod') | list }}"
  loop_control:
    label: "{{ item.name }}"
  register: experiment_pod_pcap_start
  when: experiment_pcap_enabled_effective | bool
  changed_when: true
  failed_when: false

- name: Fail when strict host pcap startup failed
  ansible.builtin.fail:
    msg: >-
      Strict pcap mode is enabled and host pcap target {{ item.item.name | default('unknown') }}
      failed to start. stdout={{ item.stdout | default('') }} stderr={{ item.stderr | default('') }}
  loop: "{{ experiment_host_pcap_start.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name | default('unknown') }}"
  when:
    - experiment_pcap_enabled_effective | bool
    - experiment_pcap_strict | bool
    - item.rc | default(0) != 0

- name: Fail when strict pod pcap startup failed
  ansible.builtin.fail:
    msg: >-
      Strict pcap mode is enabled and pod pcap target {{ item.item.name | default('unknown') }}
      failed to start. stdout={{ item.stdout | default('') }} stderr={{ item.stderr | default('') }}
  loop: "{{ experiment_pod_pcap_start.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name | default('unknown') }}"
  when:
    - experiment_pcap_enabled_effective | bool
    - experiment_pcap_strict | bool
    - item.rc | default(0) != 0
