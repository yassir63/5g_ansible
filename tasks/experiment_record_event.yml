---
- name: Capture experiment timeline event timestamp
  ansible.builtin.set_fact:
    experiment_timeline_epoch: "{{ lookup('pipe', 'date +%s') }}"
    experiment_timeline_utc: "{{ lookup('pipe', \"date -u '+%Y-%m-%dT%H:%M:%SZ'\") }}"
    experiment_timeline_local: "{{ lookup('pipe', 'TZ=' ~ (experiment_local_timezone | default(paper_local_timezone | default(validation_local_timezone | default('Europe/Paris'))) | quote) ~ \" date '+%Y-%m-%d %H:%M:%S %Z'\") }}"

- name: Append experiment timeline event
  ansible.builtin.lineinfile:
    path: "{{ experiment_results_dir | default(paper_results_dir | default(validation_results_dir)) }}/timeline_events.jsonl"
    line: "{{ experiment_timeline_event | combine(experiment_timeline_timestamp) | to_json }}"
    create: true
    insertafter: EOF
    mode: "0644"
  vars:
    experiment_timeline_timestamp:
      run_id: "{{ experiment_run_id | default(paper_run_id | default(validation_run_id | default('unknown'))) }}"
      epoch: "{{ experiment_timeline_epoch | int }}"
      utc_time: "{{ experiment_timeline_utc }}"
      local_time: "{{ experiment_timeline_local }}"
      timezone: "{{ experiment_local_timezone | default(paper_local_timezone | default(validation_local_timezone | default('Europe/Paris'))) }}"
  delegate_to: localhost
