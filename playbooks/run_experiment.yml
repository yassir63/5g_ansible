---
- name: Run generic experiment with artifact collection
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_remote_tmp: "/tmp/.ansible-{{ lookup('env', 'USER') | default('controller', true) }}/tmp"
  tasks:
    - name: Require experiment scenario file
      ansible.builtin.fail:
        msg: "Pass -e experiment_scenario_file=scenarios/experiment_templates/basic_sections.yml"
      when: experiment_scenario_file | default('') | length == 0

    - name: Resolve experiment input file paths
      ansible.builtin.set_fact:
        experiment_scenario_file_resolved: >-
          {{
            experiment_scenario_file
            if (experiment_scenario_file | regex_search('^/'))
            else playbook_dir + '/../' + experiment_scenario_file
          }}
        experiment_artifacts_file_resolved: >-
          {{
            ''
            if (experiment_artifacts_file | default('') | length == 0)
            else (
              (experiment_artifacts_file | default(''))
              if ((experiment_artifacts_file | default('')) | regex_search('^/'))
              else playbook_dir + '/../' + (experiment_artifacts_file | default(''))
            )
          }}

    - name: Load experiment scenario YAML
      ansible.builtin.include_vars:
        file: "{{ experiment_scenario_file_resolved }}"
        name: experiment_scenario_source

    - name: Load experiment artifact profile YAML
      ansible.builtin.include_vars:
        file: "{{ experiment_artifacts_file_resolved }}"
        name: experiment_artifacts
      when: experiment_artifacts_file | default('') | length > 0

    - name: Set experiment run id
      ansible.builtin.set_fact:
        experiment_run_id: "{{ experiment_run_id | default(lookup('pipe', 'date +%Y%m%d_%H%M%S')) }}"

    - name: Merge experiment scenario with artifact profile
      ansible.builtin.set_fact:
        experiment_scenario: "{{ (experiment_artifacts | default({})) | combine(experiment_scenario_source, recursive=True, list_merge='replace') }}"

    - name: Set normalized experiment config blocks
      ansible.builtin.set_fact:
        experiment_collect_config: "{{ experiment_scenario.collect | default({}) }}"
        experiment_pcap_config: "{{ experiment_scenario.pcap | default({}) }}"

    - name: Validate experiment root schema
      ansible.builtin.assert:
        that:
          - experiment_scenario_source is mapping
          - experiment_artifacts is not defined or experiment_artifacts is mapping
          - experiment_scenario is mapping
          - experiment_collect_config is mapping
          - experiment_pcap_config is mapping
          - experiment_scenario.sections is not defined or (experiment_scenario.sections is sequence and experiment_scenario.sections is not string and experiment_scenario.sections is not mapping)
        fail_msg: >-
          Invalid generic experiment YAML schema. Scenario and artifact files must be YAML maps,
          collect/pcap must be maps, and sections must be a YAML list when provided.

    - name: Resolve experiment collection file paths
      ansible.builtin.set_fact:
        experiment_prometheus_queries_json: >-
          {{
            experiment_collect_config.prometheus.queries_file
            if (
              experiment_collect_config.prometheus.queries_file is defined
              and (experiment_collect_config.prometheus.queries_file | regex_search('^/'))
            )
            else playbook_dir + '/../' + (experiment_collect_config.prometheus.queries_file | default('configs/artifacts/default_prometheus_queries.json'))
          }}

    - name: Set experiment base defaults
      ansible.builtin.set_fact:
        experiment_name: "{{ experiment_scenario.name | default('experiment') }}"
        experiment_title: "{{ experiment_scenario.title | default(experiment_scenario.name | default('Experiment')) }}"
        experiment_inventory: "{{ experiment_inventory | default(inventory_file | default(playbook_dir + '/../inventory/default/hosts.ini')) }}"
        experiment_results_dir: "{{ experiment_results_dir | default(playbook_dir + '/../results/experiment-' + experiment_run_id) }}"
        experiment_local_timezone: "{{ experiment_scenario.timezone | default(experiment_local_timezone | default(lookup('env', 'TZ') | default('Europe/Paris', true))) }}"
        experiment_start_epoch: "{{ lookup('pipe', 'date +%s') }}"

    - name: Set experiment collection defaults
      ansible.builtin.set_fact:
        experiment_collect_enabled: "{{ (experiment_collect_artifacts | default(true) | bool) and (experiment_collect_config.enabled | default(true) | bool) }}"
        experiment_collect_prometheus: "{{ experiment_collect_config.prometheus.enabled | default(experiment_collect_config.prometheus | default(true)) | bool }}"
        experiment_collect_pod_logs: "{{ experiment_collect_config.pod_logs.enabled | default(experiment_collect_config.pod_logs | default(false)) | bool }}"
        experiment_collect_pcaps: "{{ experiment_collect_config.pcaps.enabled | default(experiment_collect_config.pcaps | default(false)) | bool }}"
        experiment_split_prometheus_by_timeline: "{{ experiment_collect_config.split_by_windows | default(true) | bool }}"
        experiment_prometheus_url: >-
          {{
            experiment_prometheus_url
            if (experiment_prometheus_url | default('') | length > 0)
            else experiment_collect_config.prometheus.url | default('')
          }}
        experiment_prometheus_step: "{{ experiment_collect_config.prometheus.step | default(experiment_prometheus_step | default('1s')) }}"
        experiment_query_padding_seconds: "{{ experiment_collect_config.prometheus.padding_seconds | default(30) | int }}"
        experiment_discover_metrics_regex: "{{ experiment_collect_config.prometheus.discover_metrics_regex | default('(?i)(mcs|bler|harq|rounds|cqi|rsrp|rsrq|sinr|snr|mac_throughput|slice_throughput|prach|saturation|number_ues|i0_noise|prb|gtp_tcp|tcp_)') }}"
        experiment_discover_metrics_limit: "{{ experiment_collect_config.prometheus.discover_metrics_limit | default(80) | int }}"
        experiment_split_window_types: "{{ experiment_collect_config.window_types | default('campaign,section,scenario,step,direction,interference_phase,stress_phase') }}"
        experiment_split_padding_seconds: "{{ experiment_collect_config.split_padding_seconds | default(0) | int }}"
        experiment_split_compress: "{{ experiment_collect_config.split_compress | default(true) | bool }}"
        experiment_pod_log_namespaces: "{{ experiment_collect_config.pod_logs.namespaces | default(['open5gs', 'monitoring']) }}"
        experiment_pod_log_since: "{{ experiment_collect_config.pod_logs.since | default('8h') }}"
        experiment_pod_log_tail_lines: "{{ experiment_collect_config.pod_logs.tail_lines | default(5000) | int }}"
        experiment_pod_log_include_previous: "{{ experiment_collect_config.pod_logs.include_previous | default(true) | bool }}"
        experiment_kubeconfig: "{{ experiment_scenario.kubeconfig | default(experiment_collect_config.kubeconfig | default('/etc/kubernetes/admin.conf')) }}"

    - name: Set effective experiment sections
      ansible.builtin.set_fact:
        experiment_sections_effective: >-
          {{
            experiment_scenario.sections
            if (experiment_scenario.sections | default([]) | length > 0)
            else (
              [{
                'name': 'full_run',
                'title': 'Full run observation window',
                'runner': {
                  'type': 'pause',
                  'seconds': (
                    experiment_scenario.default_section_seconds
                    | default(experiment_collect_config.default_section_seconds | default(experiment_default_section_seconds | default(60)))
                    | int
                  )
                }
              }]
              if (experiment_collect_enabled | bool)
              else []
            )
          }}

    - name: Show default section message
      ansible.builtin.debug:
        msg:
          - "No sections were defined in {{ experiment_scenario_file }}."
          - "Artifacts are enabled, so a default full_run section will collect a general observation window."
          - "Override its duration with -e experiment_default_section_seconds=<seconds> or scenario default_section_seconds."
      when:
        - experiment_scenario.sections | default([]) | length == 0
        - experiment_collect_enabled | bool

    - name: Set inline experiment Prometheus queries when provided
      ansible.builtin.set_fact:
        experiment_prometheus_queries: "{{ experiment_collect_config.prometheus.queries }}"
      when: experiment_collect_config.prometheus.queries is defined

    - name: Resolve experiment pod log control host
      ansible.builtin.set_fact:
        experiment_pod_log_control_host_effective: >-
          {{
            experiment_collect_config.pod_logs.control_host | default(
              groups['core_node'][0]
              if (groups['core_node'] | default([]) | length > 0)
              else 'localhost'
            )
          }}

    - name: Build default experiment pcap targets
      ansible.builtin.set_fact:
        experiment_default_pcap_targets: >-
          {{
            []
            + (
              [{
                'name': 'core_n3',
                'type': 'host',
                'host': groups['core_node'][0],
                'interface': 'any',
                'filter': ''
              }]
              if (groups['core_node'] | default([]) | length > 0) else []
            )
            + (
              [{
                'name': 'ran_n3',
                'type': 'host',
                'host': groups['ran_node'][0],
                'interface': 'any',
                'filter': ''
              }]
              if (groups['ran_node'] | default([]) | length > 0) else []
            )
          }}

    - name: Set experiment pcap defaults
      ansible.builtin.set_fact:
        experiment_pcap_targets: "{{ experiment_pcap_config.targets | default(experiment_default_pcap_targets) }}"
        experiment_pcap_capture_seconds: "{{ experiment_pcap_config.capture_seconds | default(30) | int }}"
        experiment_pcap_strict: "{{ experiment_pcap_config.strict | default(false) | bool }}"
        experiment_pcap_auto_install_tcpdump: "{{ experiment_pcap_config.auto_install_tcpdump | default(true) | bool }}"
        experiment_pcap_interface: "{{ experiment_pcap_config.interface | default('any') }}"
        experiment_pcap_pod_interface: "{{ experiment_pcap_config.pod_interface | default(experiment_pcap_config.interface | default('any')) }}"
        experiment_pcap_filter: "{{ experiment_pcap_config.filter | default('') }}"
        experiment_pcap_snaplen: "{{ experiment_pcap_config.snaplen | default(192) | int }}"
        experiment_pcap_k8s_control_host: >-
          {{
            experiment_pcap_config.k8s_control_host | default(
              groups['core_node'][0]
              if (groups['core_node'] | default([]) | length > 0)
              else 'localhost'
            )
          }}

    - name: Validate experiment schema after defaults
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/experiment_validate_config.yml"

    - name: Show generic experiment dry-run preview
      ansible.builtin.debug:
        msg:
          dry_run: true
          summary: "Resolved configuration only; no deployment, sections, commands, pcaps, pod logs, or Prometheus export will run."
          run:
            run_id: "{{ experiment_run_id }}"
            name: "{{ experiment_name }}"
            title: "{{ experiment_title }}"
            timezone: "{{ experiment_local_timezone }}"
            results_dir_if_executed: "{{ experiment_results_dir }}"
          inputs:
            scenario_file: "{{ experiment_scenario_file }}"
            scenario_file_resolved: "{{ experiment_scenario_file_resolved }}"
            artifacts_file: "{{ experiment_artifacts_file | default('') }}"
            artifacts_file_resolved: "{{ experiment_artifacts_file_resolved | default('') }}"
          collection:
            enabled: "{{ experiment_collect_enabled | bool }}"
            prometheus:
              enabled: "{{ experiment_collect_prometheus | bool }}"
              url: "{{ experiment_prometheus_url }}"
              step: "{{ experiment_prometheus_step }}"
              queries_file: "{{ experiment_prometheus_queries_json }}"
              discover_metrics_regex: "{{ experiment_discover_metrics_regex }}"
              discover_metrics_limit: "{{ experiment_discover_metrics_limit }}"
            pod_logs:
              enabled: "{{ experiment_collect_pod_logs | bool }}"
              control_host: "{{ experiment_pod_log_control_host_effective }}"
              namespaces: "{{ experiment_pod_log_namespaces }}"
              since: "{{ experiment_pod_log_since }}"
              tail_lines: "{{ experiment_pod_log_tail_lines }}"
              include_previous: "{{ experiment_pod_log_include_previous | bool }}"
            pcaps:
              enabled: "{{ experiment_collect_pcaps | bool }}"
              capture_seconds: "{{ experiment_pcap_capture_seconds }}"
              strict: "{{ experiment_pcap_strict | bool }}"
              auto_install_tcpdump: "{{ experiment_pcap_auto_install_tcpdump | bool }}"
              interface: "{{ experiment_pcap_interface }}"
              pod_interface: "{{ experiment_pcap_pod_interface }}"
              filter: "{{ experiment_pcap_filter }}"
              snaplen: "{{ experiment_pcap_snaplen }}"
              k8s_control_host: "{{ experiment_pcap_k8s_control_host }}"
              targets: "{{ experiment_pcap_targets }}"
            split_by_windows:
              enabled: "{{ experiment_split_prometheus_by_timeline | bool }}"
              window_types: "{{ experiment_split_window_types }}"
              padding_seconds: "{{ experiment_split_padding_seconds }}"
              compress: "{{ experiment_split_compress | bool }}"
          sections: "{{ experiment_sections_effective }}"
      when: experiment_dry_run | default(false) | bool

    - name: Stop before executing generic experiment dry run
      ansible.builtin.meta: end_play
      when: experiment_dry_run | default(false) | bool

    - name: Create experiment results directory
      ansible.builtin.file:
        path: "{{ experiment_results_dir }}"
        state: directory
        mode: "0755"

    - name: Initialize experiment timeline event log
      ansible.builtin.copy:
        dest: "{{ experiment_results_dir }}/timeline_events.jsonl"
        content: ""
        force: false
        mode: "0644"

    - name: Write experiment run metadata
      ansible.builtin.copy:
        dest: "{{ experiment_results_dir }}/experiment_metadata.json"
        mode: "0644"
        content: |
          {{
            {
              "run_id": experiment_run_id,
              "name": experiment_name,
              "title": experiment_title,
              "scenario_file": experiment_scenario_file,
              "scenario_file_resolved": experiment_scenario_file_resolved,
              "artifacts_file": experiment_artifacts_file | default(""),
              "artifacts_file_resolved": experiment_artifacts_file_resolved | default(""),
              "results_dir": experiment_results_dir,
              "timezone": experiment_local_timezone,
              "collect": experiment_collect_config,
              "pcap": experiment_pcap_config,
              "sections": experiment_sections_effective
            } | to_nice_json
          }}

    - name: Record experiment campaign start
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/experiment_record_event.yml"
      vars:
        experiment_timeline_event:
          level: "campaign"
          phase: "start"
          name: "{{ experiment_name }}"
          title: "{{ experiment_title }}"
          kind: "generic-experiment"
          scenario_file: "{{ experiment_scenario_file }}"
          artifacts_file: "{{ experiment_artifacts_file | default('') }}"

    - name: Run experiment sections
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/experiment_run_section.yml"
      loop: "{{ experiment_sections_effective }}"
      loop_control:
        loop_var: experiment_section
        index_var: experiment_section_index
        label: "{{ experiment_section.name | default('unnamed') }}"

    - name: Record experiment campaign end
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/experiment_record_event.yml"
      vars:
        experiment_timeline_event:
          level: "campaign"
          phase: "end"
          name: "{{ experiment_name }}"
          title: "{{ experiment_title }}"
          kind: "generic-experiment"
          scenario_file: "{{ experiment_scenario_file }}"
          artifacts_file: "{{ experiment_artifacts_file | default('') }}"

    - name: Collect experiment artifacts
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/experiment_collect_artifacts.yml"
      when: experiment_collect_enabled | bool

    - name: Show artifacts-disabled message
      ansible.builtin.debug:
        msg:
          - "Experiment finished with artifact collection disabled."
          - "Timeline events, metadata, and section command output remain in {{ experiment_results_dir }}."
      when: not (experiment_collect_enabled | bool)
