- name: Setup sniffers on SMFs and AMF (Improved)
  hosts: core_node
  gather_facts: false
  roles:
    - role: monitoring/sniffers/amf
      when: monitoring_enabled
      vars:
        # redis_host: redis
        redis_host: "redis.{{ monitoring_namespace | default('monitoring') }}.svc.cluster.local"
    - role: monitoring/sniffers/smf
      when: monitoring_enabled
      vars:
        # redis_host: redis
        redis_host: "redis.{{ monitoring_namespace | default('monitoring') }}.svc.cluster.local"
    - role: monitoring/sniffers/gnb
      when: monitoring_enabled and (gnb_data_plane_probe_enabled | default(false) | bool)
    - role: monitoring/sniffers/upf
      when: monitoring_enabled and (upf_data_plane_probe_enabled | default(false) | bool)

- name: Deploy SliceAware Mechanisms
  hosts: "{{ (groups['monitor_node'] | default([]) | length > 0) | ternary('monitor_node', 'core_node') }}"
  gather_facts: false

  vars:
    core_ns: "{{ core }}"
    sliceawareness_namespace: "{{ monitoring_namespace | default('monitoring') }}"

  pre_tasks:
    - name: Delete legacy Redis and UE Mapper resources from core namespace
      ansible.builtin.command: >
        kubectl -n {{ core }} delete
        deployment/redis service/redis
        deployment/ue-mapper-api service/ue-mapper-api
        --ignore-not-found=true
      register: legacy_sliceawareness_cleanup
      changed_when: "'deleted' in legacy_sliceawareness_cleanup.stdout or 'deleted' in legacy_sliceawareness_cleanup.stderr"
      failed_when: false

    - name: Render Redis manifest for cleanup
      ansible.builtin.template:
        src: ../roles/monitoring/sliceawareness/templates/redis.yaml.j2
        dest: /tmp/redis.yaml
        mode: "0644"

    - name: Delete Redis resources if present
      ansible.builtin.command: >
        kubectl -n {{ sliceawareness_namespace }} delete -f /tmp/redis.yaml --ignore-not-found=true
      register: redis_cleanup
      changed_when: "'deleted' in redis_cleanup.stdout or 'deleted' in redis_cleanup.stderr"
      failed_when: false

    - name: Render UE Mapper manifest for cleanup
      ansible.builtin.template:
        src: ../roles/monitoring/sliceawareness/templates/ue-mapper.yaml.j2
        dest: /tmp/ue-mapper.yaml
        mode: "0644"

    - name: Delete UE Mapper resources if present
      ansible.builtin.command: >
        kubectl -n {{ sliceawareness_namespace }} delete -f /tmp/ue-mapper.yaml --ignore-not-found=true
      register: ue_mapper_cleanup
      changed_when: "'deleted' in ue_mapper_cleanup.stdout or 'deleted' in ue_mapper_cleanup.stderr"
      failed_when: false

  roles:
    - role: monitoring/sliceawareness
      when: monitoring_enabled
      vars:
        core_ns: "{{ core }}"
        sliceawareness_namespace: "{{ monitoring_namespace | default('monitoring') }}"

