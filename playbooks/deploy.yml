- name: Setup sniffers on SMFs and AMF (Improved)
  hosts: core_node
  gather_facts: false
  roles:
    - role: monarch/sniffers/amf
      when: monitoring_enabled
      vars:
        # redis_host: redis
        redis_host: "redis.{{ core }}.svc.cluster.local"
    - role: monarch/sniffers/smf
      when: monitoring_enabled
      vars:
        # redis_host: redis
        redis_host: "redis.{{ core }}.svc.cluster.local"

- name: Deploy SliceAware Mechanisms
  hosts: "{{ (groups['monitor_node'] | default([]) | length > 0) | ternary('monitor_node', 'core_node') }}"
  gather_facts: false

  vars:
    core_ns: "{{ core }}"

  pre_tasks:
    - name: Render Redis manifest for cleanup
      ansible.builtin.template:
        src: ../roles/monarch/sliceawareness/templates/redis.yaml.j2
        dest: /tmp/redis.yaml
        mode: "0644"

    - name: Delete Redis resources if present
      ansible.builtin.command: >
        kubectl -n {{ core }} delete -f /tmp/redis.yaml --ignore-not-found=true
      register: redis_cleanup
      changed_when: "'deleted' in redis_cleanup.stdout or 'deleted' in redis_cleanup.stderr"
      failed_when: false

    - name: Render UE Mapper manifest for cleanup
      ansible.builtin.template:
        src: ../roles/monarch/sliceawareness/templates/ue-mapper.yaml.j2
        dest: /tmp/ue-mapper.yaml
        mode: "0644"

    - name: Delete UE Mapper resources if present
      ansible.builtin.command: >
        kubectl -n {{ core }} delete -f /tmp/ue-mapper.yaml --ignore-not-found=true
      register: ue_mapper_cleanup
      changed_when: "'deleted' in ue_mapper_cleanup.stdout or 'deleted' in ue_mapper_cleanup.stderr"
      failed_when: false

  roles:
    - role: monarch/sliceawareness
      when: monitoring_enabled
      vars:
        core_ns: "{{ core }}"

