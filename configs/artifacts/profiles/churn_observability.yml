---
collect:
  enabled: true
  prometheus:
    enabled: true
    url: "http://127.0.0.1:30095"
    step: "1s"
    queries_file: "scripts/validation/ueransim_churn_prometheus_queries.json"
    padding_seconds: 30
    discover_metrics_regex: "(?i)(ue.?mapper|mapper|amf|smf|upf|ueransim|statefulset|pod_status|container_cpu|container_memory)"
    discover_metrics_limit: 0
  split_by_windows: true
  split_padding_seconds: 0
  split_compress: true
  window_types: "campaign,section"
  pod_logs:
    enabled: true
    namespaces: auto
    since: "4h"
    tail_lines: 200000
    include_previous: true
  pcaps:
    enabled: false

pcap:
  strict: false
  auto_install_tcpdump: true
  capture_seconds: 30
  interface: any
  filter: ""
  snaplen: 192
